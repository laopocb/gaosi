server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    default_type application/octet-stream;

    # ===== 大文件下载稳定性（修复公网 ERR_CONTENT_LENGTH_MISMATCH，任务③） =====
    # 腾讯云轻量服务器带宽低（实测 .sog 下载约 80KB/s），大 .sog 长连接容易被中断，
    # 客户端表现为 Content-Length 与实际传输字节不符（ERR_CONTENT_LENGTH_MISMATCH）。
    # 调优要点：
    #   - sendfile/tcp_nopush/tcp_nodelay：内核零拷贝 + TCP 优化（大文件吞吐更稳）；
    #   - keepalive_timeout：保持连接复用，避免反复建连；
    #   - send_timeout 300：低带宽客户端下载 7MB .sog 需 ~90s，nginx 默认 send 超时 60s
    #     会在传输中途断开连接（这正是 ERR_CONTENT_LENGTH_MISMATCH 的常见根因之一）；
    #   - reset_timedout_connection：超时连接直接 RST，避免半开连接堆积。
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;
    send_timeout 300;
    reset_timedout_connection on;
    output_buffers 32 32k;
    # 静态文件 ETag（no-cache 策略依赖：浏览器每次重新访问用 If-None-Match 条件请求验证，
    # 文件未变返回 304、已变更返回 200 新文件；nginx 默认开启，这里显式声明防误关）
    etag on;

    gzip on;
    # 只对文本类做 gzip；.sog/.ply/.webp 等二进制格式明确不压缩
    # （避免 gzip 场景下 Content-Length 与传输字节不一致，以及低端手机解压开销）。
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # SPA 回退：仅对无扩展名路径回退到 index.html（index.html 自身 + 前端路由）
    # expires -1 = Cache-Control: no-cache（配合 ETag 每次重新验证），保证入口页始终最新。
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # 加载封面（cover.jpg）：单独 no-cache（精确匹配优先级高于下方 .jpg 正则短缓存）。
    # 取舍说明：cover.jpg 默认会命中下方 `\.(jpg|jpeg)$` → max-age=300（5 分钟短缓存），
    # 新封面部署后用户重新访问最多 5 分钟后才生效；这里单独覆盖为 no-cache，与 index.html
    # 一致每次重新验证（ETag If-None-Match），部署新封面后重新访问立即生效。封面仅 168KB，
    # 每次重验证代价可忽略。
    location = /cover.jpg {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ===== 静态资源缓存策略（任务：用户重新访问页面即拿到最新版，无需强刷） =====
    # 上一版所有静态资源统一 max-age=86400（1 天缓存）是「iOS 白屏修复不生效」的主因：
    # index.js/app.js 被浏览器缓存 1 天，部署新代码后用户重新访问仍拿到旧版 bundle，
    # 旧版 iOS 路径（SOG WebP + DecompressionStream，iOS 16.0~16.3 不支持）继续白屏。
    # 修复策略（按文件类型分级）：
    #   - 代码/文本类（html/css/js/mjs/json/map/wasm/svg）：Cache-Control: no-cache
    #     —— 浏览器可缓存，但每次使用前必须向服务器重新验证（nginx 默认对静态文件生成
    #        ETag，条件请求带 If-None-Match）；文件未变返回 304（不重传正文），已变更
    #        返回 200 新文件。保证 index.html / index.js / app.js / settings.json /
    #        lod-meta.json 等「代码与配置」每次重新访问都是最新版。
    #   - 二进制大文件（.sog/.ply/.spz/.webp 等）：短缓存 max-age=300（5 分钟）
    #     —— 数据文件体积大（mobile.compressed.ply 8.1MB），弱网 iOS 每次重下代价高；
    #        5 分钟短缓存兼顾「新版数据尽快生效」与「弱网复用」。若需所有访问立即拿
    #        最新数据，可把此值改为 0（等价 no-cache，代价是每次重下大文件）。
    # 注意：nginx 的 add_header 仅对命中该 location 的响应生效；index.html 自身走
    # location / 的 expires -1（同为 no-cache），与下面 .html 规则不冲突。
    location ~* \.(html|css|js|mjs|json|map|wasm|svg)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 二进制模型/纹理/静态资源：命中即返回文件，缺失返回 404。
    # 绝不回退到 index.html —— 否则缺失的 .sog/.ply 会返回 HTML（200），
    # 客户端解析失败（如 .sog-gsplat 错误信息里的二次“请求”）。
    location ~* \.(sog|ply|spz|ksplat|splat|webp|png|jpg|jpeg|gif|ico)$ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }
}
